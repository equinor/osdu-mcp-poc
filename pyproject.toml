[project]
name = "osdu-discovery-poc"
version = "0.1.0"
description = "Discovery tools (MCP) over OSDU OpenAPI specs, schema files and the LinkML data model"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "mcp[cli]>=1.0",
    "mcp[cli]>=1.27.1",
]

[project.scripts]
osdu-query = "osdu_discovery.query:main"
osdu-mcp   = "osdu_discovery.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Only for re-running the embedding comparison in eval/ (eval/dense_index.py).
eval = [
    "chromadb>=0.5.0",
]
